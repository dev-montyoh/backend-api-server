name: pull-request-master-module.yml

on:
  workflow_call:
    inputs:
      service:
        type: string
        required: true

jobs:
  detect_changes:
    runs-on: ubuntu-latest
    outputs:
      any_changed: ${{ steps.changed.outputs.any_changed }}
    steps:
      # 코드 체크아웃
      - name: Check out repository
        uses: actions/checkout@v5

      # 변경 감지
      - name: Get changed files
        id: changed
        uses: tj-actions/changed-files@v47
        with:
          files: '${{ inputs.service }}/**'

  pull_request_master:
    needs: detect_changes
    if: needs.detect_changes.outputs.any_changed == 'true'
    runs-on: ubuntu-latest

    steps:
      # 코드 체크아웃
      - name: Check out repository
        uses: actions/checkout@v5

      # JDK 설정
      - name: Setup JDK 19
        uses: actions/setup-java@v5
        with:
          java-version: '19'
          distribution: 'temurin'

      # Gradle 캐시 설정
      - name: Setup Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # 애플리케이션 빌드 (검증)
      - name: Service ${{ inputs.service }} Gradle build jar
        run: |
          cd ${{ inputs.service }}
          chmod +x ./gradlew
          ./gradlew bootJar

      # Docker Image 빌드 검증
      - name: Service ${{ inputs.service }} Build ARM64 Docker Image (verify)
        run: |
          cd .github/docker
          docker buildx build \
            --platform linux/arm64 \
            -f Dockerfile \
            --build-arg SERVICE_NAME=${{ inputs.service }} \
            --build-arg PROFILE=prod \
            ../../
