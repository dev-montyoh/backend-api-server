name: push-master-stack.yml

on:
  push:
    branches:
      - master

jobs:
  push_master:
    strategy:
      matrix:
        service: [ gateway, payment, auth, user ]
    uses: ./.github/workflows/push-master-module.yml
    with:
      service: ${{ matrix.service }}
    secrets:
      SECRETS_STORE_ACCESS_TOKEN: ${{ secrets.SECRETS_STORE_ACCESS_TOKEN }}

  push_master_deploy:
    needs: push_master
    runs-on: ubuntu-latest

    steps:
      # 외부 private secrets store 접근
      - name: Check out Secrets store
        uses: actions/checkout@v5
        with:
          repository: 'dev-montyoh/secrets-store'
          token: ${{ secrets.SECRETS_STORE_ACCESS_TOKEN }}
          path: secrets-store

      # 외부 private secrets store 로드
      - name: Load secrets
        uses: ./secrets-store/.github/actions/load-secrets
        with:
          SECRETS_STORE_ACCESS_TOKEN: ${{ secrets.SECRETS_STORE_ACCESS_TOKEN }}

      # 외부 iac-terraform 접근
      - name: Check out iac-terraform
        uses: actions/checkout@v5
        with:
          repository: 'dev-montyoh/iac-terraform'
          token: ${{ secrets.SECRETS_STORE_ACCESS_TOKEN }}
          path: iac-terraform

      # 스택 배포
      - name: Deploy stack
        uses: ./iac-terraform/.github/actions/stack-deploy
