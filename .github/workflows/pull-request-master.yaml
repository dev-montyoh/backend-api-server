name: Pull Request Workflow (master)

on:
  pull_request:
    branches:
      - master

jobs:
  pull-request-master:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [ gateway, payment, auth ]
#        service: [ auth, content, gateway, payment, user ]

    steps:
      # 코드 체크아웃
      - name: Check out repository
        uses: actions/checkout@v5

      # 외부 private secrets store 접근
      - name: Check out Secrets store
        uses: actions/checkout@v5
        with:
          repository: 'dev-montyoh/secrets-store'
          token: ${{ secrets.SECRETS_STORE_ACCESS_TOKEN }}
          path: secrets-store

      # 외부 private secrets store 로드
      - name: Load secrets
        uses: ./secrets-store/.github/actions/load-secrets
        with:
          SECRETS_STORE_ACCESS_TOKEN: ${{ secrets.SECRETS_STORE_ACCESS_TOKEN }}

      # Github Registry 로그인
      - name: Log in to Github Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ env.DOCKER_REGISTRY_ACCESS_TOKEN }}

      # 각 서비스 변경사항 추적
      - name: Get changed files
        id: changed
        uses: tj-actions/changed-files@v47
        with:
          files: '${{matrix.service}}/**'

      # JDK 설정
      - name: Setup JDK 19
        if: steps.changed.outputs.any_changed == 'true'
        uses: actions/setup-java@v5
        with:
          java-version: '19'
          distribution: 'temurin'

      # Gradle 캐시 설정
      - name: Setup Gradle Cache
        if: steps.changed.outputs.any_changed == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Set up QEMU
        if: steps.changed.outputs.any_changed == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.changed.outputs.any_changed == 'true'
        uses: docker/setup-buildx-action@v3

      # 애플리케이션 빌드
      - name: Service ${{matrix.service}} Gradle build jar
        if: steps.changed.outputs.any_changed == 'true'
        run: |
          cd ${{matrix.service}}
          chmod +x ./gradlew
          ./gradlew bootJar

      # Docker Image Build and Push
      - name: Service ${{matrix.service}} Build and Push ARM64 Docker Image
        if: steps.changed.outputs.any_changed == 'true'
        run: |
          cd .github/docker
          docker buildx build \
            --platform linux/arm64 \
            -f Dockerfile \
            -t ghcr.io/${{ github.repository_owner }}/backend-api-server-${{ matrix.service }}:latest \
            -t ghcr.io/${{ github.repository_owner }}/backend-api-server-${{ matrix.service }}:${{ github.run_number }} \
            --build-arg SERVICE_NAME=${{ matrix.service }} \
            --build-arg PROFILE=prod \
            --push \
            ../../
