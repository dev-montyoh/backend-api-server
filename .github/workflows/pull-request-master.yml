name: Pull Request Workflow (master)

on:
  pull_request:
    branches:
      - master

jobs:
  detect_changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.changed.outputs.all_changed_files }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Get changed services
        id: changed
        uses: tj-actions/changed-files@v47
        with:
          matrix: true
          dir_names: true
          dir_names_max_depth: 1
          files: |
            gateway/**
            payment/**
            auth/**
            user/**

  pull_request_master:
    needs: detect_changes
    if: needs.detect_changes.outputs.services != '[]'
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        service: ${{ fromJSON(needs.detect_changes.outputs.services) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Setup JDK 19
        uses: actions/setup-java@v5
        with:
          java-version: '19'
          distribution: 'temurin'

      - name: Setup Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Service ${{ matrix.service }} Gradle build jar
        run: |
          cd ${{ matrix.service }}
          chmod +x ./gradlew
          ./gradlew bootJar

      - name: Service ${{ matrix.service }} Build ARM64 Docker Image (verify)
        run: |
          cd .github/docker
          docker buildx build \
            --platform linux/arm64 \
            -f Dockerfile \
            --build-arg SERVICE_NAME=${{ matrix.service }} \
            --build-arg PROFILE=prod \
            ../../

  pull_request_master_check_result:
    needs: pull_request_master
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check result
        run: |
          result="${{ needs.pull_request_master.result }}"
          [ "$result" = "success" ] || [ "$result" = "skipped" ] || exit 1
