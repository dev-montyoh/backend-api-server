name: Push Workflow (master)

on:
  push:
    branches:
      - master

jobs:
  detect_changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.changed.outputs.all_changed_files }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Get changed services
        id: changed
        uses: tj-actions/changed-files@v47
        with:
          matrix: true
          dir_names: true
          dir_names_max_depth: 1
          files: |
            gateway/**
            payment/**
            auth/**
            user/**

  push_master:
    needs: detect_changes
    if: needs.detect_changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJSON(needs.detect_changes.outputs.services) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Check out Secrets store
        uses: actions/checkout@v5
        with:
          repository: 'dev-montyoh/secrets-store'
          token: ${{ secrets.SECRETS_STORE_ACCESS_TOKEN }}
          path: secrets-store

      - name: Load secrets
        uses: ./secrets-store/.github/actions/load-secrets
        with:
          SECRETS_STORE_ACCESS_TOKEN: ${{ secrets.SECRETS_STORE_ACCESS_TOKEN }}

      - name: Log in to Github Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ env.DOCKER_REGISTRY_ACCESS_TOKEN }}

      - name: Setup JDK 19
        uses: actions/setup-java@v5
        with:
          java-version: '19'
          distribution: 'temurin'

      - name: Setup Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Service ${{ matrix.service }} Gradle build jar
        run: |
          cd ${{ matrix.service }}
          chmod +x ./gradlew
          ./gradlew bootJar

      - name: Service ${{ matrix.service }} Build and Push ARM64 Docker Image
        run: |
          cd .github/docker
          docker buildx build \
            --platform linux/arm64 \
            -f Dockerfile \
            -t ghcr.io/${{ github.repository_owner }}/backend-api-server-${{ matrix.service }}:latest \
            -t ghcr.io/${{ github.repository_owner }}/backend-api-server-${{ matrix.service }}:${{ github.run_number }} \
            --build-arg SERVICE_NAME=${{ matrix.service }} \
            --build-arg PROFILE=prod \
            --push \
            ../../

  push_master_deploy:
    needs: push_master
    runs-on: ubuntu-latest

    steps:
      - name: Check out Secrets store
        uses: actions/checkout@v5
        with:
          repository: 'dev-montyoh/secrets-store'
          token: ${{ secrets.SECRETS_STORE_ACCESS_TOKEN }}
          path: secrets-store

      - name: Load secrets
        uses: ./secrets-store/.github/actions/load-secrets
        with:
          SECRETS_STORE_ACCESS_TOKEN: ${{ secrets.SECRETS_STORE_ACCESS_TOKEN }}

      - name: Check out iac-terraform
        uses: actions/checkout@v5
        with:
          repository: 'dev-montyoh/iac-terraform'
          token: ${{ secrets.SECRETS_STORE_ACCESS_TOKEN }}
          path: iac-terraform

      - name: Deploy stack
        uses: ./iac-terraform/.github/actions/stack-deploy
