name: Manual Redeploy (master)

on:
  workflow_dispatch:

jobs:
  manual_redeploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [ gateway, payment, auth, user ]

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Check out Secrets store
        uses: actions/checkout@v5
        with:
          repository: 'dev-montyoh/secrets-store'
          token: ${{ secrets.SECRETS_STORE_ACCESS_TOKEN }}
          path: secrets-store

      - name: Load secrets
        uses: ./secrets-store/.github/actions/load-secrets
        with:
          SECRETS_STORE_ACCESS_TOKEN: ${{ secrets.SECRETS_STORE_ACCESS_TOKEN }}

      - name: Log in to Github Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ env.DOCKER_REGISTRY_ACCESS_TOKEN }}

      - name: Setup JDK 19
        uses: actions/setup-java@v5
        with:
          java-version: '19'
          distribution: 'temurin'

      - name: Setup Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Service ${{ matrix.service }} Gradle build jar
        run: |
          cd ${{ matrix.service }}
          chmod +x ./gradlew
          ./gradlew bootJar

      - name: Service ${{ matrix.service }} Build and Push ARM64 Docker Image
        run: |
          cd .github/docker
          docker buildx build \
            --platform linux/arm64 \
            -f Dockerfile \
            -t ghcr.io/${{ github.repository_owner }}/backend-api-server-${{ matrix.service }}:latest \
            -t ghcr.io/${{ github.repository_owner }}/backend-api-server-${{ matrix.service }}:${{ github.run_number }} \
            --build-arg SERVICE_NAME=${{ matrix.service }} \
            --build-arg PROFILE=prod \
            --push \
            ../../

  manual_redeploy_deploy:
    needs: manual_redeploy
    runs-on: ubuntu-latest

    steps:
      - name: Check out Secrets store
        uses: actions/checkout@v5
        with:
          repository: 'dev-montyoh/secrets-store'
          token: ${{ secrets.SECRETS_STORE_ACCESS_TOKEN }}
          path: secrets-store

      - name: Load secrets
        uses: ./secrets-store/.github/actions/load-secrets
        with:
          SECRETS_STORE_ACCESS_TOKEN: ${{ secrets.SECRETS_STORE_ACCESS_TOKEN }}

      - name: Check out iac-terraform
        uses: actions/checkout@v5
        with:
          repository: 'dev-montyoh/iac-terraform'
          token: ${{ secrets.SECRETS_STORE_ACCESS_TOKEN }}
          path: iac-terraform

      - name: Deploy stack
        uses: ./iac-terraform/.github/actions/stack-deploy
